[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-forecast-lab"
version = "0.1.0"
description = "Prospective MMA probability forecasting and immutable local evaluation ledger"
requires-python = ">=3.11"

[project.scripts]
ufc-forecast = "ufc_forecast_lab.cli:main"

[tool.setuptools.packages.find]
include = ["ufc_forecast_lab*"]
